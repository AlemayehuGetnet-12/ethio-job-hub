<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EthioJobs Admin</title>
    <!-- Use Tailwind via CDN for a lightweight admin UI without a build step -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Small admin-specific variables to match frontend tokens */
      :root{--primary:#1d4ed8;--accent:#f97316}
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="min-h-screen flex">
      <aside class="w-64 bg-white border-r p-4">
        <h2 class="text-lg font-semibold text-primary">Admin</h2>
        <nav class="mt-4 space-y-2 text-sm">
          <a class="block p-2 rounded hover:bg-slate-50" href="#">Dashboard</a>
          <a class="block p-2 rounded hover:bg-slate-50" href="#">Users</a>
          <a class="block p-2 rounded hover:bg-slate-50" href="#">Jobs</a>
        </nav>
      </aside>
      <main class="flex-1 p-6">
        <header class="mb-6">
          <h1 class="text-2xl font-semibold">Dashboard</h1>
        </header>
        <section>
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <div class="p-4 bg-white rounded shadow">Quick stat</div>
            <div class="p-4 bg-white rounded shadow">Quick stat</div>
            <div class="p-4 bg-white rounded shadow">Quick stat</div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
